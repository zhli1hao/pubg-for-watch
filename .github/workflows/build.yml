name: Android Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p app/src/main/java/com/example/pubgwatch
          mkdir -p app/src/main/res/values
      - run: |
          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories { google(); gradlePluginPortal() }
          }
          rootProject.name = "pubg-for-watch"
          include(":app")
          EOF
      - run: |
          cat > build.gradle.kts << 'EOF'
          plugins { id("com.android.application") version "8.1.0" apply false }
          EOF
      - run: |
          cat > app/build.gradle.kts << 'EOF'
          plugins { id("com.android.application") }
          android {
              namespace = "com.example.pubgwatch"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.pubgwatch"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  getByName("debug") {
                      isDebuggable = true
                  }
              }
          }
          EOF
      - run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.pubgwatch">
              <application
                  android:allowBackup="true"
                  android:label="PUBG Watch"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
      - run: |
          cat > app/src/main/java/com/example/pubgwatch/MainActivity.kt << 'EOF'
          package com.example.pubgwatch
          import android.app.Activity
          import android.os.Bundle
          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
              }
          }
          EOF
      - run: |
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">PUBG Watch</string>
          </resources>
          EOF
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: android-actions/setup-android@v4
      - run: |
          curl -L https://services.gradle.org/distributions/gradle-8.4-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-8.4/bin/gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
