name: Android Auto Build
on:
  push:
    branches: ["main"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ ! -f "settings.gradle.kts" ]; then
            cat > settings.gradle.kts << 'EOF'
pluginManagement {
    repositories {
        google()
        gradlePluginPortal()
    }
}
rootProject.name = "MyAndroidApp"
EOF
          fi
          if [ ! -f "build.gradle.kts" ]; then
            cat > build.gradle.kts << 'EOF'
plugins {
    id("com.android.application") version "8.1.0" apply false
}
EOF
          fi
          mkdir -p app/src/main/res/values
          if [ ! -f "app/build.gradle.kts" ]; then
            cat > app/build.gradle.kts << 'EOF'
plugins {
    id("com.android.application")
}
android {
    namespace = "com.example.myapp"
    compileSdk = 34
    defaultConfig {
        applicationId = "com.example.myapp"
        minSdk = 24
        targetSdk = 34
    }
    buildTypes {
        getByName("debug") {
            isDebuggable = true
        }
    }
}
EOF
          fi
          if [ ! -f "app/src/main/res/values/strings.xml" ]; then
            cat > strings.xml << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <string name="app_name">ZeroInstallApp</string>
</resources>
EOF
            mv strings.xml app/src/main/res/values/
          fi
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF
          cat > gradlew << 'EOF'
#!/bin/sh
exec "$(dirname "$0")/gradle/wrapper/gradle-wrapper.jar" "$@"
EOF
          chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: android-actions/setup-android@v4
      - run: ./gradlew assembleDebug --no-daemon
      - run: |
          mkdir -p outputs
          mv app/build/outputs/apk/debug/app-debug.apk outputs/ 2>/dev/null || true
          zip -r android-release-bundle.zip . -x "*.git*" -x "*.github*"
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: outputs/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: full-release-bundle
          path: android-release-bundle.zip
