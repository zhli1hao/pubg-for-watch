name: Android Auto Build
on:
  push:
    branches: ["main"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p gradle/wrapper
          mkdir -p app/src/main/res/values
      - run: |
          if [ ! -f "settings.gradle.kts" ]; then
            echo "pluginManagement {" > settings.gradle.kts
            echo "    repositories {" >> settings.gradle.kts
            echo "        google()" >> settings.gradle.kts
            echo "        gradlePluginPortal()" >> settings.gradle.kts
            echo "    }" >> settings.gradle.kts
            echo "}" >> settings.gradle.kts
            echo "rootProject.name = \"MyAndroidApp\"" >> settings.gradle.kts
          fi
      - run: |
          if [ ! -f "build.gradle.kts" ]; then
            echo "plugins {" > build.gradle.kts
            echo "    id(\"com.android.application\") version \"8.1.0\" apply false" >> build.gradle.kts
            echo "}" >> build.gradle.kts
          fi
      - run: |
          if [ ! -f "app/build.gradle.kts" ]; then
            echo "plugins {" > app/build.gradle.kts
            echo "    id(\"com.android.application\")" >> app/build.gradle.kts
            echo "}" >> app/build.gradle.kts
            echo "" >> app/build.gradle.kts
            echo "android {" >> app/build.gradle.kts
            echo "    namespace = \"com.example.myapp\"" >> app/build.gradle.kts
            echo "    compileSdk = 34" >> app/build.gradle.kts
            echo "    defaultConfig {" >> app/build.gradle.kts
            echo "        applicationId = \"com.example.myapp\"" >> app/build.gradle.kts
            echo "        minSdk = 24" >> app/build.gradle.kts
            echo "        targetSdk = 34" >> app/build.gradle.kts
            echo "    }" >> app/build.gradle.kts
            echo "}" >> app/build.gradle.kts
          fi
      - run: |
          if [ ! -f "app/src/main/res/values/strings.xml" ]; then
            echo "<?xml version=\"1.0\" encoding=\"utf-8\"?>" > app/src/main/res/values/strings.xml
            echo "<resources>" >> app/src/main/res/values/strings.xml
            echo "    <string name=\"app_name\">ZeroInstallApp</string>" >> app/src/main/res/values/strings.xml
            echo "</resources>" >> app/src/main/res/values/strings.xml
          fi
      - run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
            echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
            echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
            echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
            echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          fi
      - run: |
          if [ ! -f "gradlew" ]; then
            echo '#!/bin/sh' > gradlew
            echo 'exec "$(dirname "$0")/gradle/wrapper/gradle-wrapper.jar" "$@"' >> gradlew
            chmod +x gradlew
          fi
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: android-actions/setup-android@v4
      - run: ./gradlew assembleDebug --no-daemon
      - run: |
          mkdir -p outputs
          mv app/build/outputs/apk/debug/app-debug.apk outputs/ 2>/dev/null || true
          zip -r android-release-bundle.zip . -x "*.git*" -x "*.github*"
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: outputs/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: full-release-bundle
          path: android-release-bundle.zip
