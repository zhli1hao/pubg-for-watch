name: Android Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p app/src/main/java/com/example/myapp
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper
      - run: |
          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  gradlePluginPortal()
              }
          }
          rootProject.name = "pubg-for-watch"
          include(":app")
          EOF
      - run: |
          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.1.0" apply false
          }
          EOF
      - run: |
          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
          }
          android {
              namespace = "com.example.pubgwatch"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.pubgwatch"
                  minSdk = 24
                  targetSdk = 34
              }
              buildTypes {
                  getByName("debug") {
                      isDebuggable = true
                  }
              }
          }
          EOF
      - run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.pubgwatch">
              <application android:label="PUBG Watch">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
      - run: |
          cat > app/src/main/java/com/example/myapp/MainActivity.kt << 'EOF'
          package com.example.myapp
          import android.app.Activity
          import android.os.Bundle
          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
              }
          }
          EOF
      - run: |
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">PUBG Watch</string>
          </resources>
          EOF
      - run: |
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
      - run: |
          echo '#!/bin/sh' > gradlew
          echo 'exec java -jar gradle/wrapper/gradle-wrapper.jar "$@"' >> gradlew
          chmod +x gradlew
      - run: ls -la settings.gradle.kts build.gradle.kts app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: android-actions/setup-android@v4
      - run: ./gradlew :app:assembleDebug --no-daemon
      - run: |
          mkdir -p outputs
          mv app/build/outputs/apk/debug/app-debug.apk outputs/ 2>/dev/null || true
          zip -r android-release-bundle.zip . -x "*.git*" -x "*.github*"
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: outputs/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: full-release-bundle
          path: android-release-bundle.zip
