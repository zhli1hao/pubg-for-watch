name: Android Auto Build
on:
  push:
    branches: ["main"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "rootProject.name = \"MyAndroidApp\"" > settings.gradle.kts
          fi
          if [ ! -f "build.gradle.kts" ] && [ ! -f "build.gradle" ]; then
            echo "plugins { id(\"com.android.application\") version \"8.1.0\" apply false }" > build.gradle.kts
          fi
          mkdir -p app/src/main/res/values
          if [ ! -f "app/build.gradle.kts" ] && [ ! -f "app/build.gradle" ]; then
            echo "plugins { id(\"com.android.application\") }" > app/build.gradle.kts
            echo "android { compileSdk = 34; defaultConfig { applicationId = \"com.example.myapp\"; minSdk = 24; targetSdk = 34 } }" >> app/build.gradle.kts
          fi
          if [ ! -f "app/src/main/res/values/strings.xml" ]; then
            echo "<?xml version=\"1.0\" encoding=\"utf-8\"?><resources><string name=\"app_name\">ZeroInstallApp</string></resources>" > app/src/main/res/values/strings.xml
          fi
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: android-actions/setup-android@v4
      - run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.4 --distribution-type bin
          fi
          chmod +x gradlew
      - run: ./gradlew assembleDebug --no-daemon
      - run: |
          mkdir -p outputs
          mv app/build/outputs/apk/debug/app-debug.apk outputs/ 2>/dev/null || true
          zip -r android-release-bundle.zip . -x "*.git*" -x "*.github*"
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: outputs/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: full-release-bundle
          path: android-release-bundle.zip
